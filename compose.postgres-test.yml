services:
  postgres-test:
    image: ${COLLAB_TEST_POSTGRES_IMAGE:-postgres:18-alpine}
    environment:
      POSTGRES_DB: collab_test_catalog
      POSTGRES_USER: collab_test_runner
      POSTGRES_PASSWORD: ${COLLAB_TEST_DB_PASSWORD:?temporary test password is required}
    ports:
      - "127.0.0.1:${COLLAB_TEST_DB_PORT:?temporary test port is required}:5432"
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U collab_test_runner -d collab_test_catalog"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ./tests/integration/docker-init:/docker-entrypoint-initdb.d:ro
